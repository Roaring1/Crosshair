[package]
name = "crosshair"
version = "4.0.0"
edition = "2024"
rust-version = "1.92"
description = "Small, on-demand crosshair overlay"
publish = false
build = "build.rs"

[lib]
name = "crosshair_core"
path = "src/lib.rs"

[[bin]]
name = "crosshair"
path = "src/bin/crosshair.rs"

[[bin]]
name = "crosshair-settings"
path = "src/bin/settings.rs"
required-features = ["settings-ui"]

[features]
default = []
settings-ui = ["dep:slint"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
libc = "0.2"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13", features = ["randr", "shape"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
