name: Crosshair checks

on:
  push:
    branches: [main, rust-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned test and lint tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Static security analysis
        run: bandit -q -r crosshair.py crosshair_core.py -ll

      - name: Compile
        run: python -m compileall -q crosshair.py crosshair_core.py tests

      - name: Test
        run: python -m pytest -q

  dependency-audit:
    name: Dependency vulnerability audit / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-audit.txt

      - name: Install pinned audit toolchain
        run: python -m pip install --requirement requirements-audit.txt

      - name: Audit all pinned development dependencies
        run: pip-audit -r requirements-audit.txt

  rust:
    name: Rust / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build and headless-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxext-dev \
            xvfb \
            xdotool \
            x11-utils

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust core, renderer and Settings UI
        run: cargo test --locked --features settings-ui --all-targets

      - name: Build the Linux executables
        run: cargo build --locked --features settings-ui --bins

      - name: Test isolated install, autostart and uninstall lifecycle
        run: bash tests/install-smoke.sh

      - name: Test X11 click-through and cold-start lifecycle
        run: xvfb-run -a bash tests/x11-smoke.sh

      - name: Test Settings autostart buttons and independent overlay lifetime
        run: xvfb-run -a bash tests/settings-autostart-smoke.sh

      - name: Test Settings close and independent overlay lifetime
        run: xvfb-run -a bash tests/settings-close-smoke.sh

  rust-windows-compile:
    name: Rust compile / Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Compile shared core, Settings UI and Windows adapters
        run: cargo check --locked --features settings-ui --bins
