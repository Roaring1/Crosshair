name: Crosshair checks

on:
  # rust-port is validated through its open pull request; running both push
  # and pull_request events for every commit only duplicated the full matrix.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep only the newest validation for a given source branch. A pull-request
# update supersedes an older queued run instead of building a stale backlog.
concurrency:
  group: crosshair-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned test and lint tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Static security analysis
        run: bandit -q -r crosshair.py crosshair_core.py -ll

      - name: Compile
        run: python -m compileall -q crosshair.py crosshair_core.py tests

      - name: Test
        run: python -m pytest -q

  dependency-audit:
    name: Dependency vulnerability audit / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-audit.txt

      - name: Install pinned audit toolchain
        run: python -m pip install --requirement requirements-audit.txt

      - name: Audit all pinned development dependencies
        run: pip-audit -r requirements-audit.txt

  rust:
    name: Rust / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build and headless-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libxext-dev \
            python3-cairo \
            xvfb \
            xdotool \
            x11-utils \
            imagemagick \
            x11-xserver-utils

      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Rust core, renderer and Settings UI
        run: cargo test --locked --features settings-ui --all-targets

      - name: Build the Linux executables
        run: cargo build --locked --features settings-ui --bins

      - name: Build renderer parity probe
        run: cargo build --locked --example render_probe

      - name: Compare Rust rendering with the Python Cairo reference
        run: python3 tests/render-parity.py

      - name: Test isolated install, autostart and uninstall lifecycle
        run: bash tests/install-smoke.sh

      - name: Build optimized Linux executables
        run: cargo build --locked --release --features settings-ui --bins

      - name: Test optimized install, autostart and uninstall lifecycle
        run: CROSSHAIR_BIN=target/release/crosshair bash tests/install-smoke.sh

      - name: Test X11 click-through and cold-start lifecycle
        run: xvfb-run -a bash tests/x11-smoke.sh

      - name: Test Settings autostart buttons and independent overlay lifetime
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/settings-autostart-smoke.sh

      - name: Test Settings responsiveness during delayed IPC
        run: bash tests/settings-async-io-smoke.sh

      - name: Test Settings IPC failure and recovery
        run: bash tests/settings-ipc-recovery-smoke.sh

      - name: Test Settings rapid edits during IPC socket replacement
        run: bash tests/settings-ipc-restart-smoke.sh

      - name: Test Settings close and independent overlay lifetime
        run: xvfb-run -a bash tests/settings-close-smoke.sh

      - name: Capture Rust Settings UI screenshots
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash tests/settings-screenshots.sh

      - name: Upload Rust Settings UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crosshair-rust-settings-ui
          path: artifacts/settings-ui/
          if-no-files-found: warn
          retention-days: 14

  rust-windows-compile:
    name: Rust compile / Windows
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Windows-native Rust tests
        run: cargo test --locked --features settings-ui --all-targets

      - name: Build optimized Windows executables
        run: cargo build --locked --release --features settings-ui --bins

      - name: Exercise Windows installer, overlay, named pipe, Settings and shutdown
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/windows-smoke.ps1

      - name: Package Windows x64 installer
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Crosshair-Windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item target/release/crosshair.exe $package
          Copy-Item target/release/crosshair-settings.exe $package
          Copy-Item packaging/windows/Install-Crosshair.ps1 $package
          Copy-Item packaging/windows/Uninstall-Crosshair.ps1 $package
          Copy-Item packaging/windows/README-WINDOWS.txt $package
          $archive = Join-Path $env:GITHUB_WORKSPACE "Crosshair-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $archive -Force
          Write-Host "Created $archive"

      - name: Upload Windows x64 installer package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Crosshair-Windows-x64
          path: Crosshair-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
